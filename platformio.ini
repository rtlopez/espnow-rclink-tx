; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 115200
;upload_speed = 460800
lib_deps =
  yoursunny/WifiEspNow @ ^0.0.20230713
  https://github.com/rtlopez/espnow-rclink/archive/refs/tags/v0.1.1.zip
;  EspNowRcLink=symlink://../espnow-rclink
  ESP32Async/AsyncTCP @ ^3.3.0
  ESP32Async/ESPAsyncWebServer @ ^3.6.0

build_flags =
  -std=gnu++17
  -Wall
  -DASYNC_TCP_SSL_ENABLED=0

build_unflags =
  -std=gnu++11
  -ggdb

board_build.embed_txtfiles =
  src/wireless/index.html
extra_scripts = 
  merge_firmware.py

[env:esp32]
platform = espressif32
board = lolin32
framework = arduino
lib_deps =
  ${env.lib_deps}
build_unflags =
  ${env.build_unflags}
build_flags =
  ${env.build_flags}
  -DUSE_ANALOG=1

[env:esp32s2]
board = esp32-s2-saola-1
platform = espressif32
framework = arduino
lib_deps =
  ${env.lib_deps}
  schnoog/Joystick_ESP32S2@^0.9.4
build_unflags =
  ${env.build_unflags}
build_flags =
  ${env.build_flags}
  -DESP32S2
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSE_GAMEPAD=1
  -DUSE_ANALOG=1

[env:esp32c3]
board = esp32-c3-devkitm-1
platform = espressif32
framework = arduino
lib_deps =
  ${env.lib_deps}
build_unflags =
  ${env.build_unflags}
build_flags =
  ${env.build_flags}
  -DESP32C3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSE_ANALOG=1

[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
lib_deps =
  ${env.lib_deps}
build_unflags =
  ${env.build_unflags}
build_flags =
  ${env.build_flags}
extra_scripts = 