  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DMODE_GAMEPAD=1
  -DMODE_TX=1
  -DUSE_ANALOG=1
  -DPIN_POT0=1
  -DPIN_POT1=2
  -DPIN_POT2=3
  -DPIN_POT3=4
  -DPIN_SW0=6
  -DPIN_SW1=7
  -DPIN_SW2=8
  -DPIN_SW3=9

