; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 115200
;upload_speed = 460800
lib_deps =
  yoursunny/WifiEspNow @ ^0.0.20230713
  https://github.com/rtlopez/espnow-rclink/archive/refs/tags/v0.1.1.zip
;  EspNowRcLink=symlink://../espnow-rclink

build_flags =
  -std=gnu++17
  -Wall
;  -DPRINT_INFO=1 ; print some details to console
;  -DMODE_SIM=1   ; enable simulator, overwrite any rx function

build_unflags =
  -std=gnu++11
  -ggdb

[env:esp32_tx_ppm]
platform = espressif32
board = lolin32
framework = arduino
extra_scripts = merge_firmware.py
lib_deps =
  ${env.lib_deps}
build_unflags =
  ${env.build_unflags}
build_flags =
  ${env.build_flags}
  -DMODE_TX=1
  -DPIN_PPM=13

[env:esp32s2_rx]
board = esp32-s2-saola-1
platform = espressif32
framework = arduino
extra_scripts = merge_firmware.py
lib_deps =
  ${env.lib_deps}
  schnoog/Joystick_ESP32S2@^0.9.4
build_unflags =
  ${env.build_unflags}
build_flags =
  ${env.build_flags}
  -DESP32S2
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DMODE_RX=1
  -DMODE_GAMEPAD=1

[env:esp32s2_tx_ppm]
board = esp32-s2-saola-1
platform = espressif32
framework = arduino
extra_scripts = merge_firmware.py
lib_deps =
  ${env.lib_deps}
  schnoog/Joystick_ESP32S2@^0.9.4
build_unflags =
  ${env.build_unflags}
build_flags =
  ${env.build_flags}
  -DESP32C3
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DMODE_GAMEPAD=1
  -DMODE_TX=1
  -DPIN_PPM=13

[env:esp32s2_tx_analog]
board = esp32-s2-saola-1
platform = espressif32
framework = arduino
extra_scripts = merge_firmware.py
lib_deps =
  ${env.lib_deps}
